[package]
name = "portal"
version = "0.1.1"
edition = "2024"
description = "A minimal Windows game launcher dashboard built with Rust and GPUI."
publish = false

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tempfile = "3"
unicode-segmentation = "1"
winreg = "0.55"
windows = { version = "0.61", features = ["ApplicationModel", "ApplicationModel_Core", "Management_Deployment", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
